<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三国搞 - V1 联调</title>
  <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.4.0/dist/protobuf.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .title { font-size: 20px; font-weight: 700; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }
    .dot.connected { background: var(--success); }
    .self-info {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .self-info strong { color: var(--text); }
    .row { display: flex; gap: 8px; align-items: center; }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 10px;
    }
    input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: var(--primary); }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 15px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    button.success { background: #16a34a; }
    button.success:hover { background: #15803d; }
    button.danger { background: var(--danger); }
    button.danger:hover { background: var(--danger-hover); }
    .divider { height: 1px; background: var(--border); margin: 14px 0; }
    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .room-code-box { display: flex; align-items: center; gap: 10px; }
    .room-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #60a5fa;
    }
    .player-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .player-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
    }
    .badges { display: flex; gap: 6px; align-items: center; }
    .badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 600;
    }
    .badge.host { background: rgba(245, 158, 11, 0.2); color: var(--warn); }
    .badge.me { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .badge.dead { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .badge.turn { background: rgba(34, 197, 94, 0.2); color: #86efac; }
    .toast {
      font-size: 13px;
      color: #fca5a5;
      min-height: 18px;
      margin-top: 8px;
    }
    /* 游戏牌桌样式 */
    .game-meta {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .game-meta strong { color: var(--text); }
    .seats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .seat-card {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
    }
    .seat-card.current-turn { border-color: var(--success); }
    .seat-card.selected-target { border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }
    .seat-card.dead { opacity: 0.45; cursor: default; }
    .seat-name { font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .seat-stats { margin-top: 6px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
    .hp { color: #f87171; font-weight: 600; }
    .ask-banner {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid var(--primary);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .ask-text { font-size: 14px; font-weight: 600; color: #93c5fd; }
    .hand-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 76px;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .playing-card {
      width: 66px;
      height: 86px;
      background: #f8fafc;
      color: #0f172a;
      border-radius: 8px;
      border: 2px solid #cbd5e1;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: transform 0.12s, border-color 0.12s;
    }
    .playing-card:hover { transform: translateY(-4px); }
    .playing-card.selected {
      transform: translateY(-8px);
      border-color: var(--warn);
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.5);
    }
    .playing-card.red { color: #dc2626; }
    .card-top { font-size: 12px; font-weight: 700; }
    .card-center { font-size: 22px; font-weight: 800; text-align: center; }
    .game-over-box {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid var(--success);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .log-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      height: 150px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted);
    }
    .log-box .err { color: #fca5a5; }
    .log-box .ok { color: #86efac; }
    .log-box .evt { color: #fde68a; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 顶部状态 -->
    <div class="card">
      <div class="header">
        <div class="title">三国搞 · V1 联调</div>
        <div class="row">
          <span class="status">
            <span id="statusDot" class="dot"></span>
            <span id="statusText">未连接</span>
          </span>
          <button id="reconnectBtn" class="secondary" style="padding: 6px 12px; font-size: 12px;">重连</button>
        </div>
      </div>
      <div class="self-info">
        <span>我的 ID：<strong id="selfId">-</strong></span>
        <span>当前昵称：<strong id="selfName">-</strong></span>
      </div>
    </div>

    <!-- 昵称设置 -->
    <div id="nameCard" class="card">
      <div class="section-title">设置 / 修改昵称</div>
      <div class="row">
        <input id="nameInput" type="text" maxlength="16" placeholder="输入新昵称（1~16字）" />
        <button id="setNameBtn">保存昵称</button>
      </div>
      <div id="errorTip" class="toast"></div>
    </div>

    <!-- 大厅视图 -->
    <div id="lobbyCard" class="card">
      <div class="section-title">大厅</div>
      <button id="createRoomBtn" style="width: 100%;">创建房间（随机 6 位房间号）</button>
      <div class="divider"></div>
      <div class="row">
        <input id="roomCodeInput" type="text" maxlength="6" placeholder="输入 6 位房间号（不区分大小写）" />
        <button id="joinRoomBtn" class="secondary">加入房间</button>
      </div>
    </div>

    <!-- 房间等待视图 -->
    <div id="roomCard" class="card hidden">
      <div class="room-header">
        <div class="room-code-box">
          <span style="font-size: 13px; color: var(--muted);">房间号</span>
          <span id="roomCodeDisplay" class="room-code">------</span>
          <button id="copyCodeBtn" class="secondary" style="padding: 5px 10px; font-size: 12px;">复制</button>
        </div>
        <div class="row">
          <button id="startGameBtn" class="success hidden">开始游戏</button>
          <button id="leaveRoomBtn" class="danger">退出房间</button>
        </div>
      </div>
      <div class="section-title">房间成员（<span id="playerCount">0</span> / 10）</div>
      <ul id="playerList" class="player-list"></ul>
    </div>

    <!-- 游戏牌桌视图 -->
    <div id="gameCard" class="card hidden">
      <div id="gameOverBox" class="game-over-box hidden">
        <strong id="gameOverText">游戏结束</strong>
        <button id="backToRoomBtn" class="secondary">返回房间</button>
      </div>

      <div class="game-meta">
        <span>当前回合：<strong id="turnPlayerText">-</strong></span>
        <span>阶段：<strong id="phaseText">-</strong></span>
        <span>牌堆：<strong id="drawCountText">0</strong> | 弃牌：<strong id="discardCountText">0</strong></span>
      </div>

      <div class="section-title">场上角色（使用【杀】时点击目标角色选中）</div>
      <div id="seatsGrid" class="seats-grid"></div>

      <!-- 轮到我操作的提示栏 -->
      <div id="askBanner" class="ask-banner hidden">
        <div>
          <div id="askText" class="ask-text">等待操作</div>
          <div id="askCountdown" style="font-size: 12px; color: var(--muted); margin-top: 4px;"></div>
        </div>
        <div class="row">
          <button id="confirmActionBtn" class="success">出牌</button>
          <button id="passActionBtn" class="secondary">结束 / 放弃</button>
        </div>
      </div>

      <div class="section-title">我的手牌</div>
      <div id="handRow" class="hand-row"></div>
      <div id="gameErrorTip" class="toast"></div>
    </div>

    <!-- 战报 & 事件日志 -->
    <div class="card">
      <div class="section-title">战报 / 事件日志</div>
      <div id="logBox" class="log-box"></div>
    </div>
  </div>

  <script>
    let Packet = null;
    let ws = null;
    let seq = 0;
    let selfPlayer = null;
    let currentRoom = null;
    let gameState = null;
    let currentAsk = null;
    let selectedCardIds = new Set();
    let selectedTargetId = null;
    let countdownTimer = null;

    const $ = (id) => document.getElementById(id);

    const PHASE_NAMES = {
      1: "准备阶段",
      2: "判定阶段",
      3: "摸牌阶段",
      4: "出牌阶段",
      5: "弃牌阶段",
      6: "结束阶段",
    };
    const CARD_NAMES = { 1: "杀", 2: "闪", 3: "桃" };
    const SUIT_SYMBOLS = { 1: "♠", 2: "♥", 3: "♣", 4: "♦" };
    const NUM_LABELS = { 1: "A", 11: "J", 12: "Q", 13: "K" };

    function log(msg, cls = "") {
      const time = new Date().toTimeString().slice(0, 8);
      const line = document.createElement("div");
      if (cls) line.className = cls;
      line.textContent = `[${time}] ${msg}`;
      const box = $("logBox");
      box.appendChild(line);
      box.scrollTop = box.scrollHeight;
    }

    function showError(msg) {
      $("errorTip").textContent = msg || "";
      $("gameErrorTip").textContent = msg || "";
    }

    function setConnected(connected) {
      $("statusDot").classList.toggle("connected", connected);
      $("statusText").textContent = connected ? "已连接" : "已断开";
      $("setNameBtn").disabled = !connected;
      $("createRoomBtn").disabled = !connected;
      $("joinRoomBtn").disabled = !connected;
      $("leaveRoomBtn").disabled = !connected;
    }

    function renderSelf() {
      $("selfId").textContent = selfPlayer ? selfPlayer.id : "-";
      $("selfName").textContent = selfPlayer ? selfPlayer.name : "-";
    }

    function renderView() {
      if (gameState) {
        $("lobbyCard").classList.add("hidden");
        $("roomCard").classList.add("hidden");
        $("nameCard").classList.add("hidden");
        $("gameCard").classList.remove("hidden");
        renderGame();
        return;
      }

      $("gameCard").classList.add("hidden");
      $("nameCard").classList.remove("hidden");

      if (!currentRoom) {
        $("lobbyCard").classList.remove("hidden");
        $("roomCard").classList.add("hidden");
        return;
      }

      $("lobbyCard").classList.add("hidden");
      $("roomCard").classList.remove("hidden");
      $("roomCodeDisplay").textContent = currentRoom.code;

      const players = currentRoom.players || [];
      $("playerCount").textContent = players.length;

      const isHost = selfPlayer && currentRoom.hostId === selfPlayer.id;
      const startBtn = $("startGameBtn");
      startBtn.classList.toggle("hidden", !isHost);
      startBtn.disabled = players.length < 2;
      startBtn.textContent = players.length < 2 ? "至少 2 人可开始" : "开始游戏";

      const list = $("playerList");
      list.innerHTML = "";
      for (const p of players) {
        const li = document.createElement("li");
        li.className = "player-item";
        const left = document.createElement("span");
        left.textContent = p.name;

        const badges = document.createElement("span");
        badges.className = "badges";
        if (p.id === currentRoom.hostId) {
          const b = document.createElement("span");
          b.className = "badge host";
          b.textContent = "房主";
          badges.appendChild(b);
        }
        if (selfPlayer && p.id === selfPlayer.id) {
          const b = document.createElement("span");
          b.className = "badge me";
          b.textContent = "我";
          badges.appendChild(b);
        }
        const idTag = document.createElement("span");
        idTag.style.cssText = "font-size:12px;color:#64748b;font-family:monospace;";
        idTag.textContent = "#" + p.id.slice(-4);
        badges.appendChild(idTag);

        li.appendChild(left);
        li.appendChild(badges);
        list.appendChild(li);
      }
    }

    function findPlayerName(id) {
      if (!gameState || !gameState.players) return id;
      const p = gameState.players.find((x) => x.id === id);
      return p ? p.name : id;
    }

    function renderGame() {
      if (!gameState) return;
      $("turnPlayerText").textContent = findPlayerName(gameState.currentTurnPlayerId);
      $("phaseText").textContent = PHASE_NAMES[gameState.phase] || "-";
      $("drawCountText").textContent = gameState.drawPileCount || 0;
      $("discardCountText").textContent = gameState.discardPileCount || 0;

      // 渲染座位
      const grid = $("seatsGrid");
      grid.innerHTML = "";
      for (const p of gameState.players || []) {
        const div = document.createElement("div");
        div.className = "seat-card";
        if (!p.alive) div.classList.add("dead");
        if (p.id === gameState.currentTurnPlayerId) div.classList.add("current-turn");
        if (p.id === selectedTargetId) div.classList.add("selected-target");

        const isMe = selfPlayer && p.id === selfPlayer.id;
        div.onclick = () => {
          if (!p.alive || isMe) return;
          selectedTargetId = selectedTargetId === p.id ? null : p.id;
          renderGame();
        };

        const nameRow = document.createElement("div");
        nameRow.className = "seat-name";
        nameRow.innerHTML = `<span>${p.name}${isMe ? " (我)" : ""}</span>`;
        const tag = document.createElement("span");
        if (!p.alive) {
          tag.className = "badge dead";
          tag.textContent = "阵亡";
        } else if (p.id === gameState.waitingPlayerId) {
          tag.className = "badge turn";
          tag.textContent = "思考中";
        } else if (p.offline) {
          tag.className = "badge dead";
          tag.textContent = "托管";
        }
        nameRow.appendChild(tag);

        const stats = document.createElement("div");
        stats.className = "seat-stats";
        stats.innerHTML = `<span class="hp">♥ ${p.hp}/${p.maxHp}</span><span>手牌: ${p.handCount}</span>`;

        div.appendChild(nameRow);
        div.appendChild(stats);
        grid.appendChild(div);
      }

      // 渲染操作提示栏
      const banner = $("askBanner");
      if (currentAsk) {
        banner.classList.remove("hidden");
        const confirmBtn = $("confirmActionBtn");
        const passBtn = $("passActionBtn");
        passBtn.classList.remove("hidden");

        switch (currentAsk.askType) {
          case 1: // PLAY
            $("askText").textContent = `你的出牌阶段（剩余【杀】: ${currentAsk.slashRemaining}）`;
            confirmBtn.textContent = "使用选中牌";
            passBtn.textContent = "结束出牌";
            break;
          case 2: // RESPOND_SHAN
            $("askText").textContent = `${findPlayerName(currentAsk.sourcePlayerId)} 对你出了【杀】，请出【闪】或放弃`;
            confirmBtn.textContent = "打出【闪】";
            passBtn.textContent = "放弃（扣血）";
            break;
          case 3: // SAVE_TAO
            $("askText").textContent = `${findPlayerName(currentAsk.sourcePlayerId)} 濒死！是否使用【桃】相救？`;
            confirmBtn.textContent = "使用【桃】";
            passBtn.textContent = "不救";
            break;
          case 4: // DISCARD
            $("askText").textContent = `弃牌阶段：请选中 ${currentAsk.discardCount} 张手牌弃置`;
            confirmBtn.textContent = `确认弃置 (${selectedCardIds.size}/${currentAsk.discardCount})`;
            passBtn.classList.add("hidden");
            break;
        }
      } else {
        banner.classList.add("hidden");
      }

      // 渲染我的手牌
      const handRow = $("handRow");
      handRow.innerHTML = "";
      for (const c of gameState.selfHand || []) {
        const cardEl = document.createElement("div");
        cardEl.className = "playing-card";
        if (c.suit === 2 || c.suit === 4) cardEl.classList.add("red");
        if (selectedCardIds.has(c.id)) cardEl.classList.add("selected");

        const numStr = NUM_LABELS[c.number] || String(c.number);
        cardEl.innerHTML = `
          <div class="card-top">${SUIT_SYMBOLS[c.suit] || ""}${numStr}</div>
          <div class="card-center">${CARD_NAMES[c.type] || "?"}</div>
          <div style="font-size:10px;color:#64748b;text-align:right;">#${c.id}</div>
        `;

        cardEl.onclick = () => {
          if (!currentAsk) return;
          if (currentAsk.askType === 4) {
            if (selectedCardIds.has(c.id)) {
              selectedCardIds.delete(c.id);
            } else {
              selectedCardIds.add(c.id);
            }
          } else {
            if (selectedCardIds.has(c.id)) {
              selectedCardIds.clear();
            } else {
              selectedCardIds = new Set([c.id]);
            }
          }
          renderGame();
        };
        handRow.appendChild(cardEl);
      }
    }

    function startCountdown(sec) {
      if (countdownTimer) clearInterval(countdownTimer);
      let left = sec || 20;
      $("askCountdown").textContent = `剩余思考时间：${left}s`;
      countdownTimer = setInterval(() => {
        left -= 1;
        if (left <= 0) {
          clearInterval(countdownTimer);
          countdownTimer = null;
          $("askCountdown").textContent = "已超时，等待托管...";
          return;
        }
        $("askCountdown").textContent = `剩余思考时间：${left}s`;
      }, 1000);
    }

    function clearAsk() {
      currentAsk = null;
      selectedCardIds.clear();
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }
    }

    function sendPacket(payloadObj) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        showError("WebSocket 未连接");
        return;
      }
      showError("");
      seq += 1;
      const msg = Packet.create({ seq, ...payloadObj });
      ws.send(Packet.encode(msg).finish());
    }

    function handlePacket(pkt) {
      switch (pkt.payload) {
        case "welcomePush": {
          selfPlayer = pkt.welcomePush.self;
          renderSelf();
          $("nameInput").value = selfPlayer.name;
          log(`已上线: ${selfPlayer.name} (${selfPlayer.id})`, "ok");
          break;
        }
        case "setNameResp": {
          const r = pkt.setNameResp;
          if (r.code !== 0) {
            showError(r.message || "改名失败");
            return;
          }
          selfPlayer = r.self;
          renderSelf();
          if (currentRoom && currentRoom.players) {
            for (const p of currentRoom.players) {
              if (p.id === selfPlayer.id) p.name = selfPlayer.name;
            }
            renderView();
          }
          log(`改名成功: ${selfPlayer.name}`, "ok");
          break;
        }
        case "createRoomResp": {
          const r = pkt.createRoomResp;
          if (r.code !== 0) {
            showError(r.message || "创建房间失败");
            return;
          }
          currentRoom = r.room;
          renderView();
          log(`创建房间成功: ${currentRoom.code}`, "ok");
          break;
        }
        case "joinRoomResp": {
          const r = pkt.joinRoomResp;
          if (r.code !== 0) {
            showError(r.message || "加入房间失败");
            return;
          }
          currentRoom = r.room;
          renderView();
          log(`加入房间成功: ${currentRoom.code}`, "ok");
          break;
        }
        case "leaveRoomResp": {
          const r = pkt.leaveRoomResp;
          if (r.code !== 0) {
            showError(r.message || "退出房间失败");
            return;
          }
          log(`已退出房间`, "ok");
          currentRoom = null;
          renderView();
          break;
        }
        case "roomStatePush": {
          currentRoom = pkt.roomStatePush.room;
          if (!gameState) renderView();
          break;
        }
        case "startGameResp": {
          const r = pkt.startGameResp;
          if (r.code !== 0) {
            showError(r.message || "无法开始游戏");
            log(`开始游戏失败: ${r.message}`, "err");
          }
          break;
        }
        case "gameStatePush": {
          gameState = pkt.gameStatePush;
          $("gameOverBox").classList.add("hidden");
          if (currentAsk && gameState.waitingPlayerId !== selfPlayer?.id) {
            clearAsk();
          }
          renderView();
          break;
        }
        case "gameAskPush": {
          currentAsk = pkt.gameAskPush;
          selectedCardIds.clear();
          // 默认选中第一个存活的对手，方便快速出杀
          if (currentAsk.askType === 1 && gameState) {
            const aliveOpp = (gameState.players || []).find(
              (p) => p.alive && p.id !== selfPlayer?.id
            );
            if (aliveOpp && (!selectedTargetId || !gameState.players.find((p) => p.id === selectedTargetId && p.alive))) {
              selectedTargetId = aliveOpp.id;
            }
          }
          startCountdown(currentAsk.timeoutSec);
          renderView();
          break;
        }
        case "gameActionResp": {
          const r = pkt.gameActionResp;
          if (r.code !== 0) {
            showError(r.message || "操作不合法");
            log(`操作被拒绝: ${r.message}`, "err");
          } else {
            clearAsk();
            renderView();
          }
          break;
        }
        case "gameEventPush": {
          log(`⚔️ ${pkt.gameEventPush.text}`, "evt");
          break;
        }
        case "gameOverPush": {
          clearAsk();
          const w = pkt.gameOverPush;
          $("gameOverText").textContent = w.winnerName
            ? `🏆 游戏结束！${w.winnerName} 获胜！`
            : "游戏结束（平局）";
          $("gameOverBox").classList.remove("hidden");
          renderView();
          break;
        }
      }
    }

    function connect() {
      if (ws) {
        ws.close();
        ws = null;
      }
      currentRoom = null;
      gameState = null;
      selfPlayer = null;
      clearAsk();
      renderSelf();
      renderView();

      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${proto}//${location.host}/ws`);
      ws.binaryType = "arraybuffer";

      ws.onopen = () => {
        setConnected(true);
        log("WebSocket 已连接", "ok");
      };
      ws.onmessage = (ev) => {
        try {
          handlePacket(Packet.decode(new Uint8Array(ev.data)));
        } catch (err) {
          log(`解码失败: ${err.message}`, "err");
        }
      };
      ws.onclose = () => {
        setConnected(false);
        currentRoom = null;
        gameState = null;
        clearAsk();
        renderView();
        log("WebSocket 已断开", "err");
      };
    }

    $("reconnectBtn").onclick = connect;
    $("setNameBtn").onclick = () => sendPacket({ setNameReq: { name: $("nameInput").value } });
    $("nameInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("setNameBtn").click(); });
    $("createRoomBtn").onclick = () => sendPacket({ createRoomReq: {} });
    $("joinRoomBtn").onclick = () => sendPacket({ joinRoomReq: { roomCode: $("roomCodeInput").value } });
    $("roomCodeInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("joinRoomBtn").click(); });
    $("leaveRoomBtn").onclick = () => sendPacket({ leaveRoomReq: {} });
    $("startGameBtn").onclick = () => sendPacket({ startGameReq: {} });

    $("confirmActionBtn").onclick = () => {
      if (!currentAsk) return;
      const cardIds = Array.from(selectedCardIds);
      if (currentAsk.askType === 4) {
        sendPacket({
          gameActionReq: {
            askId: currentAsk.askId,
            actionType: 2, // DISCARD
            cardIds,
          },
        });
      } else {
        sendPacket({
          gameActionReq: {
            askId: currentAsk.askId,
            actionType: 1, // USE_CARD
            cardIds,
            targetId: selectedTargetId || "",
          },
        });
      }
    };

    $("passActionBtn").onclick = () => {
      if (!currentAsk) return;
      sendPacket({
        gameActionReq: {
          askId: currentAsk.askId,
          actionType: 3, // PASS
        },
      });
    };

    $("backToRoomBtn").onclick = () => {
      gameState = null;
      clearAsk();
      renderView();
    };

    $("copyCodeBtn").onclick = async () => {
      if (!currentRoom) return;
      try {
        await navigator.clipboard.writeText(currentRoom.code);
        log(`已复制房间号: ${currentRoom.code}`, "ok");
      } catch {
        log("复制失败，请手动复制", "err");
      }
    };

    async function init() {
      setConnected(false);
      try {
        const root = await protobuf.load("/proto/packet.proto");
        Packet = root.lookupType("model.Packet");
        connect();
      } catch (err) {
        showError("加载 Protobuf 协议失败");
        log(`初始化失败: ${err.message}`, "err");
      }
    }

    init();
  </script>
</body>
</html>
