syntax = "proto3";

package model;

option go_package = "github.com/Frankhuex/sanguogao/model;model";

// 花色
enum CardSuit {
  CARD_SUIT_UNSPECIFIED = 0;
  CARD_SUIT_SPADE = 1;    // 黑桃 ♠
  CARD_SUIT_HEART = 2;    // 红桃 ♥
  CARD_SUIT_CLUB = 3;     // 梅花 ♣
  CARD_SUIT_DIAMOND = 4;  // 方片 ♦
}

// 卡牌大类
enum CardCategory {
  CARD_CATEGORY_UNSPECIFIED = 0;
  CARD_CATEGORY_BASIC = 1;          // 基本牌
  CARD_CATEGORY_TRICK = 2;          // 非延时锦囊牌
  CARD_CATEGORY_DELAYED_TRICK = 3;  // 延时锦囊牌
  CARD_CATEGORY_EQUIP = 4;          // 装备牌
}

// 装备槽位（为后续装备系统预留）
enum EquipSlot {
  EQUIP_SLOT_UNSPECIFIED = 0;
  EQUIP_SLOT_WEAPON = 1;      // 武器
  EQUIP_SLOT_ARMOR = 2;       // 防具
  EQUIP_SLOT_PLUS_HORSE = 3;  // +1 坐骑（防御马）
  EQUIP_SLOT_MINUS_HORSE = 4; // -1 坐骑（进攻马）
  EQUIP_SLOT_TREASURE = 5;    // 宝物
}

// 伤害属性（为军争篇火杀/雷杀/铁索连环预留）
enum DamageElement {
  DAMAGE_ELEMENT_NORMAL = 0;  // 无属性
  DAMAGE_ELEMENT_FIRE = 1;    // 火焰伤害
  DAMAGE_ELEMENT_THUNDER = 2; // 雷电伤害
}

// 卡牌种类（后续按规则集持续扩充）
enum CardType {
  CARD_TYPE_UNSPECIFIED = 0;
  CARD_TYPE_SHA = 1;   // 杀
  CARD_TYPE_SHAN = 2;  // 闪
  CARD_TYPE_TAO = 3;   // 桃
}

message CardInfo {
  uint32 id = 1;
  CardType type = 2;
  CardCategory category = 3;
  CardSuit suit = 4;
  int32 number = 5;  // 1..13 (A..K)
}
