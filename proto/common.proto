syntax = "proto3";

package model;

option go_package = "github.com/Frankhuex/sanguogao/model;model";

enum ErrorCode {
  ERROR_CODE_OK = 0;
  ERROR_CODE_INVALID_PARAM = 1;       // 参数不合法（如名字为空或超长）
  ERROR_CODE_ROOM_NOT_FOUND = 2;      // 房间不存在
  ERROR_CODE_ROOM_FULL = 3;           // 房间已满
  ERROR_CODE_ALREADY_IN_ROOM = 4;     // 已在某个房间中
  ERROR_CODE_NOT_IN_ROOM = 5;         // 当前不在任何房间中
  ERROR_CODE_NOT_HOST = 6;            // 非房主无权操作
  ERROR_CODE_NOT_ENOUGH_PLAYERS = 7;  // 人数不足（至少 2 人）
  ERROR_CODE_ROOM_PLAYING = 8;        // 房间正在游戏中
  ERROR_CODE_INVALID_ACTION = 9;      // 非法出牌或响应操作
  ERROR_CODE_INTERNAL = 99;           // 服务端内部错误
}

message Ping {
  int64 ts = 1;
}

message Pong {
  int64 ts = 1;
}

message PlayerInfo {
  string id = 1;
  string name = 2;
}
