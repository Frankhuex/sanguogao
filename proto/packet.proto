syntax = "proto3";

package model;

option go_package = "github.com/Frankhuex/sanguogao/model;model";

import "common.proto";
import "room.proto";
import "game.proto";

message Packet {
  uint64 seq = 1;
  oneof payload {
    // 基础心跳
    Ping ping = 10;
    Pong pong = 11;

    // 房间请求 & 响应
    SetNameReq set_name_req = 20;
    SetNameResp set_name_resp = 21;

    CreateRoomReq create_room_req = 22;
    CreateRoomResp create_room_resp = 23;

    JoinRoomReq join_room_req = 24;
    JoinRoomResp join_room_resp = 25;

    LeaveRoomReq leave_room_req = 26;
    LeaveRoomResp leave_room_resp = 27;

    // 游戏请求 & 响应
    StartGameReq start_game_req = 30;
    StartGameResp start_game_resp = 31;

    GameActionReq game_action_req = 32;
    GameActionResp game_action_resp = 33;

    // 服务端主动推送
    WelcomePush welcome_push = 49;
    RoomStatePush room_state_push = 50;
    GameStatePush game_state_push = 51;
    GameAskPush game_ask_push = 52;
    GameEventPush game_event_push = 53;
    GameOverPush game_over_push = 54;
  }
}
